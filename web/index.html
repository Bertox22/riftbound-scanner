<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <title>Riftbound Scanner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=27">
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="17" y="9" width="30" height="42" rx="4" fill="none" stroke="currentColor" stroke-width="4" transform="rotate(-8 32 30)"/>
        <path d="M32 18l6 12-6 12-6-12z" fill="currentColor"/>
      </svg>
      Riftbound Scanner
    </h1>
    <span id="owned-count" class="pill">0 cartas</span>
  </header>

  <main>
    <!-- ESCANEAR -->
    <section id="view-scan" class="view active">
      <div class="cam" id="cam">
        <video id="video" playsinline muted></video>
        <div class="cam-placeholder" id="cam-placeholder">
          <p>Coloca cada carta dentro del recuadro.<br>Se añade sola cuando la reconoce.</p>
          <button id="btn-start" class="btn primary">Activar cámara</button>
          <label class="btn ghost small">
            o reconocer desde una foto
            <input type="file" id="photo-input" accept="image/*" capture="environment" hidden>
          </label>
        </div>
        <div class="guide" id="guide"><span></span></div>
        <div class="flash" id="flash"></div>
        <div class="cam-status" id="cam-status">Cargando modelo…</div>
      </div>

      <div class="cam-controls">
        <button id="btn-stop" class="btn ghost small" hidden>Parar cámara</button>
        <label class="toggle"><input type="checkbox" id="opt-auto" checked><span>Añadir automáticamente</span></label>
        <label class="toggle"><input type="checkbox" id="opt-foil"><span>Foil</span></label>
        <button id="btn-torch" class="btn ghost small" hidden>Linterna</button>
      </div>

      <div id="candidates" class="candidates"></div>

      <div class="section-head">
        <h2>Escaneadas en esta sesión <span id="session-count" class="muted"></span></h2>
        <button id="btn-clear-session" class="btn ghost small">Vaciar lista</button>
      </div>
      <ul id="recent" class="recent"></ul>
    </section>

    <!-- COLECCIÓN -->
    <section id="view-collection" class="view">
      <div class="filters">
        <input type="search" id="col-search" placeholder="Buscar carta, texto o etiqueta…">
        <div class="filter-row">
          <select id="col-set"><option value="">Todos los sets</option></select>
          <select id="col-type"><option value="">Todos los tipos</option></select>
          <select id="col-domain"><option value="">Todos los dominios</option></select>
        </div>
        <div class="filter-row">
          <label class="toggle"><input type="checkbox" id="col-owned" checked><span>Solo las que tengo</span></label>
          <label class="toggle"><input type="checkbox" id="col-errata"><span>Con errata</span></label>
          <select id="col-sort">
            <option value="set">Orden: set y número</option>
            <option value="name">Orden: nombre</option>
            <option value="qty">Orden: cantidad</option>
            <option value="energy">Orden: coste</option>
            <option value="price">Orden: precio (más caras primero)</option>
            <option value="value">Orden: valor de mis copias</option>
          </select>
        </div>
      </div>
      <p id="col-summary" class="muted"></p>
      <div id="col-grid" class="grid"></div>
      <div class="section-head">
        <h2>Importar y exportar</h2>
      </div>
      <div class="actions">
        <button id="btn-import-table" class="btn primary small">Importar Excel / CSV / lista</button>
      </div>
      <p class="muted small">Exportar:</p>
      <div class="actions">
        <button id="btn-export-excel" class="btn ghost small">Exportar Excel</button>
        <button id="btn-export-csv" class="btn ghost small">Exportar CSV</button>
        <button id="btn-export-json" class="btn ghost small">Exportar copia (JSON)</button>
        <label class="btn ghost small">Importar copia (JSON)<input type="file" id="import-json" accept=".json,application/json" hidden></label>
      </div>
    </section>

    <!-- MAZOS -->
    <section id="view-decks" class="view">
      <div id="deck-list-view">
        <div class="section-head">
          <h2>Mis mazos</h2>
          <div class="actions">
            <button id="btn-import-deck" class="btn ghost small">Importar mazo</button>
            <button id="btn-new-deck" class="btn primary small">Nuevo mazo</button>
          </div>
        </div>
        <ul id="deck-list" class="deck-list"></ul>
        <div id="deck-export-all" class="actions export-all" hidden>
          <span class="muted small">Exportar todos los mazos:</span>
          <button id="btn-decks-excel" class="btn ghost small">Excel</button>
          <button id="btn-decks-csv" class="btn ghost small">CSV</button>
          <button id="btn-decks-txt" class="btn ghost small">Texto</button>
        </div>
      </div>
      <div id="deck-editor" hidden></div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-view="scan" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><rect x="9" y="7.5" width="6" height="9" rx="1"/></svg>
      <span>Escanear</span>
    </button>
    <button data-view="collection">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="9" rx="1"/><rect x="13" y="4" width="7" height="9" rx="1"/><path d="M4 17h7M13 17h7M4 20h7M13 20h7"/></svg>
      <span>Colección</span>
    </button>
    <button data-view="decks">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3.5" width="10" height="14" rx="1.5"/><path d="M5.5 6.5v12A1.5 1.5 0 0 0 7 20h8.5"/></svg>
      <span>Mazos</span>
    </button>
  </nav>

  <dialog id="card-dialog"></dialog>
  <dialog id="picker-dialog"></dialog>
  <dialog id="import-dialog"></dialog>
  <div id="toast" class="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
